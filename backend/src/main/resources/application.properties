# Application
spring.application.name=shipment-tracking-portal
server.port=8080

# PostgreSQL - use env vars in production (e.g. DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shipment_tracking}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT - use env var JWT_SECRET in production; never commit real secrets
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-for-signing-must-be-at-least-32-chars}
jwt.expiration-ms=86400000
